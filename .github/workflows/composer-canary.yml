name: Composer CLI canary

# Early warning for a new Claude Code release (CONVERSATION.md §8.1.9, v1.8.3).
#
# Sessions update their CLI on their own (the native installer moved
# Educación HZ to 2.1.317 on 2026-11-04). By default (COMPOSER_CLI_MIN_VERSION
# open, v1.9.2) such a release — patch, minor or major — is ADMITTED without anyone having
# run §8.2.6 against it. This job runs that revalidation (the composer smoke
# in both install layouts, plus the conversation smoke) against the newest
# published releases (the three newest plain X.Y.Z, so a release that was
# `latest` only between two runs is still covered), daily and on demand.
#
# It is NOT a prior guarantee of compatibility: a release can reach sessions
# before the next run, more than three releases between two runs leave the
# older ones untested (dispatch with cli=<version> for any version a session
# log shows), and the smokes cover the §8.2.6 list, not every CLI behaviour. It is the fastest signal we have to exclude a broken release.
#
# INFORMATIVE (owner, 2026-11-10): new stable releases are admitted by default
# (COMPOSER_CLI_MIN_VERSION / RECREATE_CLI_MIN_VERSION are open), so a green
# run needs no action. A red run opens (or comments on) an issue with the
# exclusion procedure. It never changes production: putting the version in
# COMPOSER_CLI_DENY (and RECREATE_CLI_DENY if the control dir is affected)
# and restarting the backend is the operator's decision.
#
# Not path-filtered and not a PR check: its input is the npm registry.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      cli:
        description: "Claude Code version to test (X.Y.Z); empty = the npm `latest` dist-tag"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  resolve:
    name: Versions under test
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.v.outputs.versions }}
    steps:
      - name: Resolve
        id: v
        env:
          REQUESTED: ${{ inputs.cli }}
        run: |
          set -euo pipefail
          plain='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [ -n "${REQUESTED:-}" ]; then
            [[ "$REQUESTED" =~ $plain ]] || { echo "not a plain release: $REQUESTED"; exit 1; }
            list=$(jq -cn --arg v "$REQUESTED" '[$v]')
          else
            # Plain releases only (the backend's rule), newest three by semver.
            list=$(npm view @anthropic-ai/claude-code versions --json \
              | jq -c '[.[] | select(test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))]
                       | sort_by(split(".") | map(tonumber)) | .[-3:] | reverse')
          fi
          for v in $(jq -r '.[]' <<<"$list"); do [[ "$v" =~ $plain ]] || { echo "bad: $v"; exit 1; }; done
          echo "versions=$list" >> "$GITHUB_OUTPUT"
          echo "### Claude Code under test: $list" >> "$GITHUB_STEP_SUMMARY"

  canary:
    name: Composer + conversation smokes, CLI ${{ matrix.cli }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # This job installs and runs an unvetted third-party release: it gets a
    # read-only token. The issue is opened by `report`, which runs no CLI.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cli: ${{ fromJSON(needs.resolve.outputs.versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      # Most of the build is the environment, not the CLI under test: an apt
      # mirror hiccup failed all three versions on 2026-11-11 (#583–#585,
      # green the next day). One retry. But the CLI itself is installed in
      # this build (`npm install -g @anthropic-ai/claude-code@X`), so a failure
      # in THAT layer is a CLI failure and is reported as one (Verdict reads
      # cli-install-failed, written below).
      - name: Build session image with CLI ${{ matrix.cli }}
        id: build
        run: |
          build() {
            docker build --progress=plain --build-arg CLAUDE_CODE_VERSION=${{ matrix.cli }} \
              -t shared-terminal-session:canary ./session-image 2>&1 | tee build.log
          }
          build || { echo "::warning::image build failed, retrying once in 60 s"; sleep 60; build; } || {
            # The failing step is named in BuildKit's final error line.
            if grep -E 'failed to solve: process .*npm install -g .*@anthropic-ai/claude-code@' build.log >/dev/null; then
              touch cli-install-failed
            fi
            exit 1
          }

      - name: Conversation hooks smoke (control dir validation)
        env:
          ST_CLI_PIN: ${{ matrix.cli }}
        run: ./session-image/conversation-smoke.sh shared-terminal-session:canary

      - name: Composer terminal smoke (§8.2.6)
        working-directory: backend
        run: npx tsx src/conversation/composer.smoke.ts docker shared-terminal-session:canary

      - name: Composer terminal smoke, native-installer layout
        working-directory: backend
        env:
          ST_NATIVE_LAYOUT: "1"
        run: npx tsx src/conversation/composer.smoke.ts docker shared-terminal-session:canary

      - name: Verdict
        if: always()
        env:
          CLI: ${{ matrix.cli }}
          OUTCOME: ${{ job.status }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS for $CLI — nothing to do (new stable releases are admitted by default)." >> "$GITHUB_STEP_SUMMARY"
          elif [ -e cli-install-failed ]; then
            # The CLI's own install layer failed: that IS a CLI failure.
            echo "FAIL for $CLI — the CLI itself failed to install in the image; see the issue opened by this run." >> "$GITHUB_STEP_SUMMARY"
            mkdir -p failed && echo "smoke" > "failed/$CLI"
          elif [ "$BUILD" != "success" ]; then
            # No smoke ran and the CLI install was not the failing layer.
            echo "NO VERDICT for $CLI — the image build (or an earlier setup step) failed outside the CLI install; no smoke ran. Re-run before judging the CLI." >> "$GITHUB_STEP_SUMMARY"
            mkdir -p failed && echo "build" > "failed/$CLI"
          else
            echo "FAIL for $CLI — see the issue opened by this run; exclude it with COMPOSER_CLI_DENY (and RECREATE_CLI_DENY if the conversation smoke failed)." >> "$GITHUB_STEP_SUMMARY"
            mkdir -p failed && echo "smoke" > "failed/$CLI"
          fi

      - name: Record a failure for the report job
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-${{ matrix.cli }}
          path: failed/

  report:
    name: Make failures visible (issue)
    needs: [resolve, canary]
    if: always() && needs.resolve.result == 'success' && needs.canary.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Collect the failed versions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: failed-*
          path: failed
          merge-multiple: true

      - name: Open, reopen or comment on one issue per failed version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          plain='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          for f in failed/*; do
            [ -e "$f" ] || continue
            CLI=$(basename "$f")
            [[ "$CLI" =~ $plain ]] || continue
            if [ "$(cat "$f")" = "build" ]; then
              # An environment failure gets its own issue, without the
              # exclusion procedure: denying a CLI for an apt outage is wrong.
              title="Composer CLI canary: image build failed (no verdict) for Claude Code $CLI"
              body="The canary could not build the session image (or an earlier setup step failed) for **$CLI**: $RUN_URL. The failing layer was **not** the CLI install, and no smoke ran, so this is not a verdict on the CLI. Check the failing step in the run. If it is in fact the CLI, treat it as a CLI failure. Otherwise re-run the canary (workflow_dispatch, cli=$CLI), and close this issue when a run gets past the build."
              hit=$(gh issue list --state all --search "in:title \"$title\"" --json number,title,state \
                --jq "map(select(.title == \"$title\")) | .[0] // empty")
              if [ -z "$hit" ]; then
                gh issue create --title "$title" --body "$body"
              else
                n=$(jq -r .number <<<"$hit")
                [ "$(jq -r .state <<<"$hit")" = "OPEN" ] || gh issue reopen "$n"
                gh issue comment "$n" --body "Build failed again: $RUN_URL"
              fi
              continue
            fi
            title="Composer CLI canary FAILED for Claude Code $CLI"
            body=$(cat <<MD
          The §8.2.6 revalidation failed against Claude Code **$CLI**: $RUN_URL

          The open policy is the default (\`COMPOSER_CLI_MIN_VERSION\`), so the composer may be typing into sessions that run this release. Nothing was changed automatically; the Terminal is unaffected.

          **Exclusion procedure (operator):**
          1. Read the failing step of the run above; decide whether the failure is the CLI's or the environment's.
          2. If the CLI's: on the backend host add \`$CLI\` to \`COMPOSER_CLI_DENY\` in \`.env\` (comma-separated, plain X.Y.Z). If the failing step is the **conversation smoke** (its phase 11d validates \`/etc/st-control\`), add it to \`RECREATE_CLI_DENY\` too, so no recreation creates a container on it.
          3. \`docker compose up -d --no-build app\` (restart only; the backend refuses to start on a malformed list).
          4. Check the log line \`[server] composer CLI policy: …\` lists \`deny $CLI\`, and that a send on such a session answers 409 \`cli-unvalidated\` / \`denied\`.
          5. Keep this issue open while the version is denied; close it only after a green run (\`workflow_dispatch\`, cli=$CLI) and the DENY entry removed.
          MD
            )
            # Exact title match, any state (search is full-text; the jq filter decides).
            hit=$(gh issue list --state all --search "in:title \"$title\"" --json number,title,state \
              --jq "map(select(.title == \"$title\")) | .[0] // empty")
            if [ -z "$hit" ]; then
              gh issue create --title "$title" --body "$body"
            else
              n=$(jq -r .number <<<"$hit")
              [ "$(jq -r .state <<<"$hit")" = "OPEN" ] || gh issue reopen "$n"
              gh issue comment "$n" --body "Failed again: $RUN_URL"
            fi
          done
