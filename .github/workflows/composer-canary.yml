name: Composer CLI canary

# Early warning for a new Claude Code release (CONVERSATION.md §8.1.9, v1.8.3).
#
# Sessions update their CLI on their own (the native installer moved
# Educación HZ to 2.1.317 on 2026-11-04). With COMPOSER_CLI_MIN_VERSION set,
# such a release — patch, minor or major — is ADMITTED without anyone having
# run §8.2.6 against it. This job runs that revalidation (the composer smoke
# in both install layouts, plus the conversation smoke) against the newest
# published releases (the three newest plain X.Y.Z, so a release that was
# `latest` only between two runs is still covered), daily and on demand.
#
# It is NOT a prior guarantee of compatibility: a release can reach sessions
# before the next run, more than three releases between two runs leave the
# older ones untested (dispatch with cli=<version> for any version a session
# log shows), and the smokes cover the §8.2.6 list, not every CLI behaviour. It is the fastest signal we have to exclude a broken release.
#
# A red run opens (or comments on) an issue with the exclusion procedure. It
# never changes production: putting the version in COMPOSER_CLI_DENY and
# restarting the backend is the operator's decision. A green run is evidence
# to add the version to COMPOSER_CLI_VERSIONS and the cli-variants matrix.
#
# Not path-filtered and not a PR check: its input is the npm registry.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      cli:
        description: "Claude Code version to test (X.Y.Z); empty = the npm `latest` dist-tag"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  resolve:
    name: Versions under test
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.v.outputs.versions }}
    steps:
      - name: Resolve
        id: v
        env:
          REQUESTED: ${{ inputs.cli }}
        run: |
          set -euo pipefail
          plain='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [ -n "${REQUESTED:-}" ]; then
            [[ "$REQUESTED" =~ $plain ]] || { echo "not a plain release: $REQUESTED"; exit 1; }
            list=$(jq -cn --arg v "$REQUESTED" '[$v]')
          else
            # Plain releases only (the backend's rule), newest three by semver.
            list=$(npm view @anthropic-ai/claude-code versions --json \
              | jq -c '[.[] | select(test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))]
                       | sort_by(split(".") | map(tonumber)) | .[-3:] | reverse')
          fi
          for v in $(jq -r '.[]' <<<"$list"); do [[ "$v" =~ $plain ]] || { echo "bad: $v"; exit 1; }; done
          echo "versions=$list" >> "$GITHUB_OUTPUT"
          echo "### Claude Code under test: $list" >> "$GITHUB_STEP_SUMMARY"

  canary:
    name: Composer + conversation smokes, CLI ${{ matrix.cli }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # This job installs and runs an unvetted third-party release: it gets a
    # read-only token. The issue is opened by `report`, which runs no CLI.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cli: ${{ fromJSON(needs.resolve.outputs.versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Build session image with CLI ${{ matrix.cli }}
        run: docker build --build-arg CLAUDE_CODE_VERSION=${{ matrix.cli }} -t shared-terminal-session:canary ./session-image

      - name: Conversation hooks smoke (control dir validation)
        env:
          ST_CLI_PIN: ${{ matrix.cli }}
        run: ./session-image/conversation-smoke.sh shared-terminal-session:canary

      - name: Composer terminal smoke (§8.2.6)
        working-directory: backend
        run: npx tsx src/conversation/composer.smoke.ts docker shared-terminal-session:canary

      - name: Composer terminal smoke, native-installer layout
        working-directory: backend
        env:
          ST_NATIVE_LAYOUT: "1"
        run: npx tsx src/conversation/composer.smoke.ts docker shared-terminal-session:canary

      - name: Verdict
        if: always()
        env:
          CLI: ${{ matrix.cli }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS for $CLI — evidence to add it to COMPOSER_CLI_VERSIONS and the cli-variants matrix." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "FAIL for $CLI — see the issue opened by this run; exclude it with COMPOSER_CLI_DENY." >> "$GITHUB_STEP_SUMMARY"
            mkdir -p failed && echo "$CLI" > "failed/$CLI"
          fi

      - name: Record a failure for the report job
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failed-${{ matrix.cli }}
          path: failed/

  report:
    name: Make failures visible (issue)
    needs: [resolve, canary]
    if: always() && needs.resolve.result == 'success' && needs.canary.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Collect the failed versions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: failed-*
          path: failed
          merge-multiple: true

      - name: Open, reopen or comment on one issue per failed version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          plain='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          for f in failed/*; do
            [ -e "$f" ] || continue
            CLI=$(basename "$f")
            [[ "$CLI" =~ $plain ]] || continue
            title="Composer CLI canary FAILED for Claude Code $CLI"
            body=$(cat <<MD
          The §8.2.6 revalidation failed against Claude Code **$CLI**: $RUN_URL

          With \`COMPOSER_CLI_MIN_VERSION\` set, the composer may be typing into sessions that run this release. Nothing was changed automatically.

          **Exclusion procedure (operator):**
          1. Read the failing step of the run above; decide whether the failure is the CLI's or the environment's.
          2. If the CLI's: on the backend host add \`$CLI\` to \`COMPOSER_CLI_DENY\` in \`.env\` (comma-separated, plain X.Y.Z).
          3. \`docker compose up -d --no-build app\` (restart only; the backend refuses to start on a malformed list).
          4. Check the log line \`[server] composer CLI policy: …\` lists \`deny $CLI\`, and that a send on such a session answers 409 \`cli-unvalidated\` / \`denied\`.
          5. Keep this issue open while the version is denied; close it only after a green run (\`workflow_dispatch\`, cli=$CLI) and the DENY entry removed.
          MD
            )
            # Exact title match, any state (search is full-text; the jq filter decides).
            hit=$(gh issue list --state all --search "in:title \"$title\"" --json number,title,state \
              --jq "map(select(.title == \"$title\")) | .[0] // empty")
            if [ -z "$hit" ]; then
              gh issue create --title "$title" --body "$body"
            else
              n=$(jq -r .number <<<"$hit")
              [ "$(jq -r .state <<<"$hit")" = "OPEN" ] || gh issue reopen "$n"
              gh issue comment "$n" --body "Failed again: $RUN_URL"
            fi
          done
