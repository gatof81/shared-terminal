name: Session Image

# Builds session-image/ and runs its docker-level smoke test (#352):
# entrypoint persistence symlinks, the Claude CLI version pin, the
# ~/.claude.json file-symlink-survives-config-write invariant, recreate
# survival, and process-group cancellation with the backend's real
# wrapper/kill scripts. See session-image/smoke-test.sh for the assertions.
# A second step runs session-image/conversation-smoke.sh (Phase 3.0c): the
# image's real CLI firing the conversation hooks from managed settings at the
# real 3.0b ingest stack over a `st-backend` network alias.
#
# This workflow IS path-filtered, deliberately diverging from ci.yml's
# no-filters stance. ci.yml avoids filters because its jobs have inputs
# outside their own directories (shared-root edits — compose file, the
# workflow itself — can break a workspace without touching it), so a
# filter there risks false negatives. This job's input set is exactly the
# filtered set: the image build consumes only session-image/, and the
# smoke tests additionally consume the exec scripts extracted from
# backend/src/dockerManager.ts, the conversation receiver and hooks-file
# builder under backend/src/conversation/, the recreation engine under
# backend/src/recreate/ (with the attempt record and lifecycle lock), and
# the `st-backend` alias in docker-compose.yml — which is why those are in
# the filter. The cost side is also different: a docker build is ~5 min of
# critical path, not the <1 min ci.yml accepts as noise.
#
# Consequence: this can NOT be a required check in branch protection — it
# doesn't run on most PRs. It protects by running when its inputs change,
# including on pushes to main.

on:
  pull_request:
    paths:
      - "session-image/**"
      - "backend/src/dockerManager.ts"
      - "backend/src/conversation/**"
      - "backend/src/recreate/**"
      - "backend/src/recreateAttempt.ts"
      - "backend/src/sessionLifecycleLock.ts"
      - "docker-compose.yml"
      - ".github/workflows/session-image.yml"
  push:
    branches: [main]
    paths:
      - "session-image/**"
      - "backend/src/dockerManager.ts"
      - "backend/src/conversation/**"
      - "backend/src/recreate/**"
      - "backend/src/recreateAttempt.ts"
      - "backend/src/sessionLifecycleLock.ts"
      - "docker-compose.yml"
      - ".github/workflows/session-image.yml"

# Same shape as ci.yml: cancel superseded PR runs, never cancel main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    name: Build + docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node + backend deps are only needed for the smoke test's tsx probe
      # that extracts PGID_WRAPPER_SCRIPT / KILL_PROCESS_GROUP_SCRIPT from
      # backend source (copies here would drift).
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps (tsx probe)
        working-directory: backend
        run: npm ci

      # Plain `docker build`, no buildx cache: the job only runs when the
      # image's inputs changed, i.e. exactly when a cache would be cold.
      - name: Build session image
        run: docker build -t shared-terminal-session ./session-image

      - name: Smoke test
        run: ./session-image/smoke-test.sh shared-terminal-session

      # #444: the attach client inside the container must exit with the last
      # WS listener (release) and the leftovers of a dead backend process must
      # be swept by the next attach — only a real tmux shows it. Drives the real
      # DockerManager.attach()/detach() against a disposable container.
      - name: tmux client release smoke test (#444, real Docker)
        working-directory: backend
        run: npx tsx src/tmuxClients.smoke.ts shared-terminal-session

      # The real CLI against a scripted model (no secrets, no egress to the
      # API) and the real ingest stack; prints and step-summarises the
      # timings the 3.0c PR reports.
      - name: Conversation hooks smoke test
        run: ./session-image/conversation-smoke.sh shared-terminal-session

      # 3.0d: the recreation engine against this real dockerd and image
      # (docker diff, archives, renames, defer-skill-seed across N's boots,
      # the relay identified on N). Disposable containers only, D1 in memory.
      # Evidence for the recreation layer allowlist: what the real CLI
      # leaves under /tmp in a stopped session container (names, types,
      # sizes). Prints only; the assertions are in realDocker.smoke.ts.
      - name: CLI /tmp layer evidence (real CLI)
        run: ./session-image/test/cli-tmp-evidence.sh shared-terminal-session

      - name: Recreation smoke test (real Docker)
        working-directory: backend
        run: npx tsx src/recreate/realDocker.smoke.ts shared-terminal-session

      # 3.0d audit (#468 §10): recreation with data and `claude --resume`,
      # ports through the real dispatcher, the backend process SIGKILLed
      # mid-recreation (D8), the relay unavailable and killed, PATCH with an
      # open and a new CLI tab, end-to-end revocation, a package in the layer
      # blocking without effect. Disposable containers and network only; D1
      # is a file (stated per scenario in the printed coverage matrix).
      # Secrets compared by hash, never printed; output unfiltered, and on
      # failure each container's own log is dumped.
      - name: Recreation audit smoke test (real Docker)
        working-directory: backend
        run: npx tsx src/recreate/recreateAudit.smoke.ts shared-terminal-session

      # 3.2 composer (CONVERSATION.md §8.2.6, §8.1.5 2b): the real CLI of the
      # image in a real tmux pane, driven through the backend's own argv
      # builders and consumption rule — segmented delivery arrives byte for
      # byte as UserPromptSubmit, `/` is a command not a prompt, a send while
      # busy is queued, the input region reads empty/text/empty, and the
      # paste→CSI u same-read hazard is reproduced as evidence. Scripted
      # model, no key, no egress; disposable container and network.
      # The contract wants this list run with the version in COMPOSER_CLI_VERSIONS
      # (default 2.1.314), not the image's pin (2.1.308, the recreation
      # allowlist): a second build of the same Dockerfile with only the CLI
      # version changed — every layer before the install is cached from the
      # build above, so this costs the npm install and the layers after it.
      - name: Build session image with the composer's CLI version
        run: docker build --build-arg CLAUDE_CODE_VERSION=2.1.314 -t shared-terminal-session:cli-2.1.314 ./session-image

      - name: Composer terminal smoke test (real CLI 2.1.314, real tmux)
        working-directory: backend
        run: npx tsx src/conversation/composer.smoke.ts docker shared-terminal-session:cli-2.1.314
