name: CI

# Runs on every PR and every push to main. The two workspaces build and test
# independently — if only the frontend changes, the backend job still runs
# because path filters here would miss shared-root edits (Dockerfile,
# docker-compose, workflow itself). CI is fast enough (<1 min each) that the
# extra noise is cheaper than the false-negative risk of path-filtering.

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs when a PR gets pushed to rapidly. On main we let
# every run finish — cancelling mid-merge would leave main without a
# recorded green status, which branch protection needs to gate future
# merges.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default. Neither job pushes code or posts comments.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      # tmuxClientsScript.test.ts (#444) runs the release/sweep script against
      # real tmux clients; without tmux those tests skip, and CI would stop
      # proving the fence and the fail-closed paths.
      - name: tmux (for the #444 script tests)
        run: command -v tmux >/dev/null || sudo apt-get install -y --no-install-recommends tmux

      - name: Lint (Biome)
        run: npm run lint

      - name: Typecheck + build
        run: npm run build

      - name: Tests
        run: npm test

  frontend:
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Tests
        run: npm test

      # `npm run build` is `tsc && vite build`. VITE_API_URL is consumed by
      # vite.config.ts to rewrite the CSP meta tag; falls back to localhost
      # if unset, but setting it here exercises the replacement path.
      - name: Typecheck + build
        env:
          VITE_API_URL: http://localhost:3001
        run: npm run build

  frontend-e2e:
    name: Frontend e2e (Playwright, desktop + mobile)
    # Pinned, not ubuntu-latest: `playwright install --with-deps` only knows
    # the Ubuntu releases its version shipped with (1.52 → up to 24.04); on a
    # newer runner it refuses to install the browser's shared libraries.
    # Bump the runner together with the Playwright version.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # The harness runs the app on the Vite dev server against the
      # deterministic mock backend in e2e/mockBackend.ts — no real backend,
      # no Docker. Only Chromium is needed; `--with-deps` installs the
      # shared libraries it links against.
      - name: Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Typecheck e2e
        run: npm run typecheck:e2e

      - name: e2e tests
        run: npm run test:e2e

      # Traces, failure screenshots and the actual/diff images of a failed
      # screenshot assertion. A visual regression is reviewed from here.
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
