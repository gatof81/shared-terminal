# st-ops — restricted operator account for Shared Terminal (ops/vm100/README.md).
# Installed by ops/vm100/install.sh. Remove this file + `systemctl reload ssh` to cut every st-ops key at once.
Match User st-ops
	# Root-owned key file: the account cannot add or change its own keys.
	AuthorizedKeysFile /etc/st-ops/authorized_keys
	PasswordAuthentication no
	KbdInteractiveAuthentication no
	PubkeyAuthentication yes
	# Belt and braces with the per-key `restrict,command=`: whatever the key line says, only the dispatcher runs.
	ForceCommand /usr/local/lib/st-ops/st-ops-dispatch
	PermitTTY no
	AllowTcpForwarding no
	AllowStreamLocalForwarding no
	AllowAgentForwarding no
	X11Forwarding no
	PermitTunnel no
	PermitUserRC no
	GatewayPorts no
	# $SSH_USER_AUTH names the key that authenticated: the dispatcher maps its fingerprint to an identity
	# (/etc/st-ops/identities) for the audit log. One account, one key per operator session.
	ExposeAuthInfo yes
