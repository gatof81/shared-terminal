Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 50
LogLevel Info
PidFile "/tmp/tinyproxy.pid"
# Only the POC's internal network may use the proxy.
Allow 172.31.250.0/24
# HTTPS only, by host name; everything not listed is denied.
ConnectPort 443
FilterDefaultDeny Yes
FilterExtended Yes
FilterURLs No
FilterCaseSensitive No
Filter "/tmp/filter"
DisableViaHeader Yes
